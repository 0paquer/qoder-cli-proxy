<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qoder CLI Proxy — API 文档</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; }
    #banner {
      background: #4f46e5; color: #fff; padding: 10px 18px; font: 500 14px/1.6 sans-serif;
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    }
    #banner a { color: #e0e7ff; }
    #swagger { max-width: 1100px; margin: 0 auto; padding: 0 12px 48px; }
  </style>
</head>
<body>
  <div id="banner">
    <strong>Qoder CLI Proxy API</strong>
    <span>管理接口：右上角 Authorize 填入 <code>POST /admin/login</code> 返回的 token</span>
    <span>网关接口：Bearer <code>qk-…</code> 用户密钥</span>
    <a href="/ui/">← 返回控制台</a>
  </div>
  <div id="swagger"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger',
        deepLinking: true,
        persistAuthorization: true,
        tryItOutEnabled: true,
      });
    };
  </script>
</body>
</html>
